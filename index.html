<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Chippuu ❤️</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffb199);
overflow:hidden;
}

.container{
text-align:center;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:35px;
border-radius:25px;
box-shadow:0 10px 35px rgba(0,0,0,.2);
max-width:90%;
width:420px;
animation:pop 1s ease;
z-index:2;
}

@keyframes pop{
from{
transform:scale(.7);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

h1{
font-size:2rem;
color:#fff;
margin-bottom:15px;
}

p{
color:white;
font-size:1.05rem;
line-height:1.6;
margin-bottom:25px;
}

button{
padding:14px 28px;
margin:10px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

#yes{
background:#ff2d55;
color:white;
box-shadow:0 0 20px rgba(255,45,85,.6);
}

#yes:hover{
transform:scale(1.08);
}

#no{
background:white;
color:#ff2d55;
}

#message{
margin-top:20px;
font-size:22px;
color:white;
font-weight:bold;
min-height:40px;
}

.heart{
position:absolute;
color:#fff;
font-size:20px;
animation:float 7s linear infinite;
opacity:.7;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(.5);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120px) scale(1.6);
opacity:0;
}
}

@media(max-width:480px){

h1{
font-size:1.7rem;
}

p{
font-size:15px;
}

button{
width:85%;
font-size:17px;
}

.container{
padding:25px;
}
}
</style>

</head>
<body>

<div class="container">
<h1>💖 Dear Chippuu 💖</h1>

<p>
From the moment you came into my life,
every day has become brighter,
every smile more meaningful,
and every heartbeat whispers your name. ❤️
</p>

<p>
You are my happiness,
my peace,
my favorite person,
and my forever.
</p>

<h2 style="color:white;margin-bottom:20px;">
Will You Be Mine Forever? 💍❤️
</h2>

<button id="yes">YES ❤️</button>
<button id="no">NO 🙈</button>

<div id="message"></div>

</div>

<script>

// Floating Hearts
function createHeart(){
const heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*25)+"px";
heart.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},7000);
}

setInterval(createHeart,300);

// YES Button
document.getElementById("yes").onclick=function(){

document.getElementById("message").innerHTML=
"Yayyyy!! ❤️ I Love You So Much Chippuu 💖🥰";

const duration=6000;
const end=Date.now()+duration;

(function frame(){
confetti({
particleCount:8,
angle:60,
spread:70,
origin:{x:0}
});

confetti({
particleCount:8,
angle:120,
spread:70,
origin:{x:1}
});

if(Date.now()<end){
requestAnimationFrame(frame);
}
})();
}

// NO Button
const no=document.getElementById("no");

no.addEventListener("mouseover",moveButton);
no.addEventListener("click",moveButton);

function moveButton(){
const x=Math.random()*(window.innerWidth-120);
const y=Math.random()*(window.innerHeight-60);

no.style.position="absolute";
no.style.left=x+"px";
no.style.top=y+"px";
}

</script>

</body>
</html>
